<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Network Scan Report</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0d0d0d; color: #e0e0e0; padding: 30px; }
        h1 { color: #00ff99; }
        h2 { color: #00ccff; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .meta { color: #aaa; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th { background: #1a1a2e; color: #00ff99; padding: 10px; text-align: left; }
        td { padding: 8px 10px; border-bottom: 1px solid #222; }
        tr:hover { background: #1a1a1a; }
        .risk-warn { color: #ff4444; font-weight: bold; }
        .risk-ok { color: #00ff99; }
        .host-block { background: #111; border: 1px solid #222; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
    </style>
</head>
<body>

</div>

</body>
</html>
